[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-vision"
version = "0.1.0"
description = "Ternary (1.58-bit) Vision Transformers in PyTorch, following BitNet b1.58 and BitNet v2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/kotak-ai/bitnet-vision"

[tool.setuptools.packages.find]
include = ["bitnet_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer training checks (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]
