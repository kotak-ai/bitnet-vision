[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-vision"
version = "0.1.0"
description = "Ternary (1.58-bit) Vision Transformers in PyTorch, following BitNet b1.58 and BitNet v2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.17,<0.18", "numpy"]
mlx = ["mlx>=0.32", "numpy"]  # bitnet_vision.apple.mlx_ternary, which converts arrays through NumPy
lora = ["safetensors>=0.4"]  # LoRA adapter files as adapter_model.safetensors (adapter_model.bin without it)

[project.urls]
Repository = "https://github.com/kotak-ai/bitnet-vision"

[tool.setuptools.packages.find]
include = ["bitnet_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end training checks, a few seconds each (skip with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]
